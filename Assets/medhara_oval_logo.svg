<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="ovalBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1a2d"/>
      <stop offset="50%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#02050a"/>
    </radialGradient>

    <!-- Glowing Hextech Cyan/Sapphire Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pillarGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="metalStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientHalo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
  </defs>

  <!-- ================= OVAL CAPSULE CONTAINER ================= -->
  <!-- Outer Oval Glow Shadow -->
  <ellipse cx="320" cy="120" rx="310" ry="110" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.25" filter="url(#ambientHalo)"/>
  
  <!-- Outer Oval Background Canvas -->
  <ellipse cx="320" cy="120" rx="310" ry="110" fill="url(#ovalBg)"/>
  
  <!-- Sleek Hextech Border Rings -->
  <ellipse cx="320" cy="120" rx="308" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
  <ellipse cx="320" cy="120" rx="302" ry="102" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6" stroke-dasharray="6 4"/>

  <!-- Internal Ambient Lighting -->
  <circle cx="130" cy="120" r="80" fill="#0284c7" opacity="0.28" filter="url(#ambientHalo)"/>
  <circle cx="420" cy="120" r="90" fill="#0369a1" opacity="0.18" filter="url(#ambientHalo)"/>

  <!-- ================= LEFT: MEMORY PILLAR & CONSTELLATIONS ================= -->
  <g id="pillarGroup" transform="translate(-10, 0)">
    
    <!-- Constellation Orbital Rings -->
    <g id="orbits" opacity="0.85">
      <ellipse cx="145" cy="120" rx="88" ry="34" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.6" transform="rotate(-20 145 120)"/>
      <ellipse cx="145" cy="120" rx="78" ry="26" fill="none" stroke="url(#goldGrad)" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.5" transform="rotate(32 145 120)"/>

      <!-- Constellation Polygons & Connecting Lines -->
      <polyline points="80,75 105,50 145,30 185,50 210,75" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.45" stroke-dasharray="3 3"/>
      <polyline points="70,125 90,165 120,195 170,195 200,165 220,125" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 3"/>
      <line x1="105" y1="50" x2="70" y2="125" stroke="#38bdf8" stroke-width="0.7" opacity="0.35"/>
      <line x1="185" y1="50" x2="220" y2="125" stroke="#38bdf8" stroke-width="0.7" opacity="0.35"/>

      <!-- Starlight Nodes -->
      <circle cx="105" cy="50" r="3" fill="#e0f2fe" filter="url(#glow)"/>
      <circle cx="185" cy="50" r="3" fill="#e0f2fe" filter="url(#glow)"/>
      <circle cx="80" cy="75" r="2" fill="#67e8f9"/>
      <circle cx="210" cy="75" r="2" fill="#67e8f9"/>
      <circle cx="70" cy="125" r="3" fill="#fde047" filter="url(#glow)"/>
      <circle cx="220" cy="125" r="3" fill="#fde047" filter="url(#glow)"/>
      <circle cx="90" cy="165" r="2" fill="#38bdf8"/>
      <circle cx="200" cy="165" r="2" fill="#38bdf8"/>
      <circle cx="120" cy="195" r="2.5" fill="#67e8f9"/>
      <circle cx="170" cy="195" r="2.5" fill="#67e8f9"/>
    </g>

    <!-- The Classical Ionic Memory Pillar -->
    <g id="pillar" filter="url(#glow)">
      <!-- Pinnacle Polaris Beacon Star -->
      <g transform="translate(145, 36)">
        <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" fill="#ffffff"/>
        <circle cx="0" cy="0" r="4" fill="#67e8f9"/>
      </g>

      <!-- Capital Top Abacus Plate -->
      <path d="M112,58 L178,58 L172,66 L118,66 Z" fill="url(#metalStone)" stroke="#38bdf8" stroke-width="1.1"/>
      
      <!-- Ionic Scrolls (Volutes) -->
      <path d="M108,68 C96,68 92,78 103,83 C111,86 118,80 118,74 C118,70 113,68 109,68 Z" fill="none" stroke="#38bdf8" stroke-width="2.6"/>
      <circle cx="106" cy="75" r="1.8" fill="#e0f2fe"/>
      
      <path d="M182,68 C194,68 198,78 187,83 C179,86 172,80 172,74 C172,70 177,68 181,68 Z" fill="none" stroke="#38bdf8" stroke-width="2.6"/>
      <circle cx="184" cy="75" r="1.8" fill="#e0f2fe"/>

      <!-- Capital Core Gem -->
      <path d="M116,67 L174,67 L168,82 L122,82 Z" fill="url(#metalStone)" stroke="#0ea5e9" stroke-width="1"/>
      <polygon points="145,69 152,75 145,81 138,75" fill="#67e8f9" stroke="#ffffff" stroke-width="0.8"/>

      <!-- Pillar Shaft Outer & Flutes -->
      <rect x="124" y="84" width="42" height="95" fill="#082f49" stroke="#0284c7" stroke-width="1.2" rx="1.5"/>
      
      <!-- Vertical Energy Channels -->
      <rect x="128" y="85" width="7" height="93" rx="2" fill="url(#pillarGlow)" opacity="0.85"/>
      <rect x="139" y="85" width="12" height="93" rx="2" fill="url(#pillarGlow)"/>
      <line x1="145" y1="86" x2="145" y2="176" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
      <rect x="155" y="85" width="7" height="93" rx="2" fill="url(#pillarGlow)" opacity="0.85"/>

      <!-- Shaft Runic Bands -->
      <rect x="123" y="116" width="44" height="4.5" fill="url(#metalStone)" stroke="#38bdf8" stroke-width="0.7" rx="0.8"/>
      <polygon points="145,115 148,118 145,121 142,118" fill="#67e8f9"/>
      
      <rect x="123" y="150" width="44" height="4.5" fill="url(#metalStone)" stroke="#38bdf8" stroke-width="0.7" rx="0.8"/>
      <polygon points="145,149 148,152 145,155 142,152" fill="#67e8f9"/>

      <!-- Pillar Stepped Pedestal Base -->
      <path d="M120,181 L170,181 L175,189 L115,189 Z" fill="url(#metalStone)" stroke="#38bdf8" stroke-width="1"/>
      <path d="M110,190 L180,190 L186,200 L104,200 Z" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <polygon points="145,191 153,195 145,199 137,195" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8"/>
      <path d="M95,201 L195,201 L200,207 L90,207 Z" fill="url(#metalStone)" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="97" y1="203" x2="193" y2="203" stroke="#67e8f9" stroke-width="1" opacity="0.8"/>
    </g>
  </g>

  <!-- Vertical Divider Line in Oval -->
  <line x1="255" y1="45" x2="255" y2="195" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <circle cx="255" cy="120" r="3.5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- ================= RIGHT: PROMINENT TYPOGRAPHY ================= -->
  <g id="textGroup">
    <!-- Glow Under-layer -->
    <text x="435" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', serif" font-size="48" font-weight="900" letter-spacing="9" fill="#0284c7" opacity="0.7" filter="url(#glow)">MEDHARA</text>
    
    <!-- Crisp Foreground Text (Platinum & Cyan Highlights) -->
    <text x="435" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', serif" font-size="48" font-weight="900" letter-spacing="9" fill="#ffffff">MEDHARA</text>

    <!-- Subtitle: COGNITIVE MEMORY OS -->
    <text x="435" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" letter-spacing="9" fill="#38bdf8" opacity="0.95">MEMORY OS</text>

    <!-- Decorative Baseline Accents -->
    <line x1="330" y1="178" x2="410" y2="178" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <polygon points="435,174 439,178 435,182 431,178" fill="#fde047" filter="url(#glow)"/>
    <line x1="460" y1="178" x2="540" y2="178" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    
    <!-- Tagline -->
    <text x="435" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" letter-spacing="5" fill="#94a3b8" opacity="0.8">SPATIAL COGNITION &amp; FSRS-4.5</text>
  </g>
</svg>